<div class="flex h-screen justify-center items-center">
  <div class="p-8 shadow-lg rounded-xl border-4 border-solid border-gray-500 w-full max-w-3xl">
    <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">

      <div class="flex flex-col md:flex-row md:space-x-5 pb-5">
        <div class="flex-1 pb-4 md:pb-0">
          <p-floatlabel variant="on">
            <input pInputText id="name" formControlName="name" autocomplete="off" />
            <label for="name">Name</label>
          </p-floatlabel>

          @if (isInvalid('name')) {
            <p-message severity="error" size="small" variant="simple">Name is required</p-message>
          }
        </div>

        <div class="flex-1">
          <p-floatlabel variant="on">
            <input pInputText id="surname" formControlName="surname" autocomplete="off" />
            <label for="surname">Surname</label>
          </p-floatlabel>

          @if (isInvalid('surname')) {
            <p-message severity="error" size="small" variant="simple">Surname is required</p-message>
          }
        </div>
      </div>


      <div class="flex flex-col md:flex-row md:space-x-5 pb-5">
        <div class="flex-1 pb-4 md:pb-0">
          <p-floatlabel variant="on">
            <input pInputText id="email" formControlName="email" autocomplete="off" />
            <label for="email">Email</label>
          </p-floatlabel>

          @if (isInvalid('email')) {
            <p-message severity="error" size="small" variant="simple">Email is required</p-message>
          }
        </div>

        <div class="flex-1">
          <p-floatlabel variant="on">
            <input pInputText id="phoneNumber" formControlName="phoneNumber" autocomplete="off" />
            <label for="phoneNumber">Phone Number</label>
          </p-floatlabel>

          @if (isInvalid('phoneNumber')) {
            <p-message severity="error" size="small" variant="simple">Phone Number is required</p-message>
          }
        </div>
      </div>


      <div class="pb-5">
        <p-floatlabel variant="on">
          <textarea
            pTextarea
            id="message"
            formControlName="message"
            rows="5"
            style="resize: none; border: 1px solid #ccc; border-radius: 6px; padding: 0.75rem; color: #333;"
            class="h-full w-full"
          ></textarea>
          <label for="message">Message Here</label>
        </p-floatlabel>

        @if (isInvalid('message')) {
          <p-message severity="error" size="small" variant="simple">Message is required</p-message>
        }
      </div>

    
      <div class="flex flex-col md:flex-row justify-center gap-4">
        <p-button
          label="Submit"
          [rounded]="true"
          [raised]="true"
          icon="pi pi-check"
          [loading]="loading"
          (onClick)="load()"
        />
        <p-button
          label="Cancel"
          [rounded]="true"
          [raised]="true"
          icon="pi pi-times"
          [loading]="loading"
          (onClick)="load()"
          severity="secondary"
        />
      </div>
    </form>
  </div>
</div>
