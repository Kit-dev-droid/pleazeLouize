<div class="flex h-screen justify-center items-center ">
    <div class=" p-8 shadow-lg rounded-xl border-4 border-solid border-grey-500 ">
        <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
            <div class="flex pb-5">
                <div class="pr-5">
                    <p-floatlabel variant="on">
                        <input pInputText id="on_label" formControlName="name" autocomplete="off" />
                        <label for="on_label">name</label>
                    </p-floatlabel>

                     @if (isInvalid('name')) {
                        <p-message severity="error" size="small" variant="simple">Name is required</p-message>
                    }
                    
                </div>
                <div>
                    <p-floatlabel variant="on">
                        <input pInputText id="on_label" formControlName="surname" autocomplete="off" />
                        <label for="on_label">Surname</label>
                    </p-floatlabel>

                     @if (isInvalid('surname')) {
                        <p-message severity="error" size="small" variant="simple">Surname is required</p-message>
                    }
                </div>
            </div>
            <div class="flex pb-5">
                <div class="pr-5">
                    <p-floatlabel variant="on">
                        <input pInputText id="on_label" formControlName="email" autocomplete="off" />
                        <label for="on_label">Email</label>
                    </p-floatlabel>

                     @if (isInvalid('email')) {
                        <p-message severity="error" size="small" variant="simple">Email is required</p-message>
                    }

                </div>
                <div>
                    <p-floatlabel variant="on">
                        <input pInputText id="on_label" formControlName="phoneNumber" autocomplete="off" />
                        <label for="on_label">Phone Number</label>
                    </p-floatlabel>

                    @if (isInvalid('phoneNumber')) {
                        <p-message severity="error" size="small" variant="simple">Phone Number is required</p-message>
                    }
                </div>
            </div>
            <div class="pb-5">
                 <p-floatlabel variant="on">
                    <textarea pTextarea id="over_label" formControlName="message" rows="5" cols="57"  style="resize: none; border: 1px solid #ccc; border-radius: 6px; padding: 0.75rem; color: #333;" class="h-full w-full"></textarea>
                    <label for="on_label">Message Here</label>
                </p-floatlabel>

                 @if (isInvalid('message')) {
                        <p-message severity="error" size="small" variant="simple">Message is required</p-message>
                    }
            </div>
            <div class="flex justify-center">
                <div class="card flex justify-center gap-4 pr-5">
                    <p-button label="Submit" [rounded]="true" [raised]="true" icon="pi pi-check" [loading]="loading"  (onClick)="load()" />
                </div>
                <div class="card flex justify-center gap-4">
                    <p-button label="Cancel" [rounded]="true" [raised]="true" icon="pi pi-times" [loading]="loading" (onClick)="load()" severity="secondary"/>
                </div>

            </div>
        </form>
    </div>
</div>
